# Máquina de Turing para calcular el n-ésimo número de Fibonacci
# 
# CONVENCIÓN:
# - Entrada: n en notación unaria (n unos). Ej: n=3 → "111"
# - Salida: F(n) en notación unaria. Ej: F(5)=5 → "11111"
# - F(0)=0, F(1)=1, F(2)=1, F(3)=2, F(4)=3, F(5)=5...
#
# ESTRUCTURA DE LA CINTA:
# [contador]#[a]#[b]  donde a=F(i-1), b=F(i)
#
# ALGORITMO:
# 1. F(0)=0: cinta vacía
# 2. F(1)=1: un solo 1
# 3. n>=2: inicializar a=1, b=1, iterar n-2 veces: (a,b) = (b, a+b)

states:
  - q_init      # Estado inicial
  - q_check1    # Verificar si n=1
  - q_done1     # Caso F(1)=1
  - q_goto_end  # Ir al final para n>=2
  - q_write_a   # Escribir a=1
  - q_write_sep # Escribir separador
  - q_write_b   # Escribir b=1
  - q_rewind    # Volver al inicio del contador
  - q_dec       # Decrementar contador
  - q_check_done # Verificar si terminamos
  - q_find_a    # Encontrar inicio de 'a'
  - q_copy_a    # Copiar un 1 de 'a' al final de 'b'
  - q_goto_b_end # Ir al final de 'b'
  - q_paste     # Pegar 1 al final de 'b'
  - q_back_to_a # Volver a 'a'
  - q_find_mark # Buscar marca Y
  - q_restore_a # Restaurar 'a' (Y->1)
  - q_shift1    # Iniciar shift: borrar 'a' viejo
  - q_shift2    # Continuar shift
  - q_shift3    # Encontrar nuevo 'a'
  - q_shift4    # Volver para siguiente iteración
  - q_clean1    # Limpiar: ir al resultado
  - q_clean2    # Limpiar separadores
  - q_accept    # Estado final

input_alphabet:
  - '1'

tape_alphabet:
  - '1'
  - 'X'         # Marca contador usado
  - 'Y'         # Marca temporal en copia
  - '#'         # Separador
  - '_'         # Blanco

blank_symbol: '_'
initial_state: q_init
final_states:
  - q_accept

transitions:
  # ===== CASOS BASE =====
  
  # F(0) = 0
  - from_state: q_init
    read: '_'
    to_state: q_accept
    write: '_'
    move: S
  
  # n >= 1: marcar y continuar
  - from_state: q_init
    read: '1'
    to_state: q_check1
    write: 'X'
    move: R
  
  # Solo un 1 → F(1) = 1
  - from_state: q_check1
    read: '_'
    to_state: q_done1
    write: '_'
    move: L
  
  - from_state: q_done1
    read: 'X'
    to_state: q_accept
    write: '1'
    move: S
  
  # n >= 2: continuar al final
  - from_state: q_check1
    read: '1'
    to_state: q_goto_end
    write: '1'
    move: R
  
  # ===== INICIALIZACIÓN n>=2 =====
  
  - from_state: q_goto_end
    read: '1'
    to_state: q_goto_end
    write: '1'
    move: R
  
  # Escribir #a donde a=1
  - from_state: q_goto_end
    read: '_'
    to_state: q_write_a
    write: '#'
    move: R
  
  - from_state: q_write_a
    read: '_'
    to_state: q_write_sep
    write: '1'
    move: R
  
  # Escribir #b donde b=1
  - from_state: q_write_sep
    read: '_'
    to_state: q_write_b
    write: '#'
    move: R
  
  - from_state: q_write_b
    read: '_'
    to_state: q_rewind
    write: '1'
    move: L
  
  # ===== LOOP PRINCIPAL =====
  
  # Volver al inicio (buscar primera X)
  - from_state: q_rewind
    read: '1'
    to_state: q_rewind
    write: '1'
    move: L
  
  - from_state: q_rewind
    read: '#'
    to_state: q_rewind
    write: '#'
    move: L
  
  - from_state: q_rewind
    read: 'X'
    to_state: q_dec
    write: 'X'
    move: R
  
  # Decrementar: marcar siguiente 1 como X
  - from_state: q_dec
    read: '1'
    to_state: q_check_done
    write: 'X'
    move: R
  
  - from_state: q_dec
    read: 'X'
    to_state: q_dec
    write: 'X'
    move: R
  
  # Verificar si hay más iteraciones
  - from_state: q_check_done
    read: '1'
    to_state: q_find_a
    write: '1'
    move: R
  
  # No más 1s → limpiar y terminar
  - from_state: q_check_done
    read: '#'
    to_state: q_clean1
    write: '_'
    move: R
  
  # ===== SUMA: b_nuevo = a + b =====
  
  # Ir hasta 'a' (después del primer #)
  - from_state: q_find_a
    read: '1'
    to_state: q_find_a
    write: '1'
    move: R
  
  - from_state: q_find_a
    read: '#'
    to_state: q_copy_a
    write: '#'
    move: R
  
  # Copiar 1s de 'a' al final de 'b'
  - from_state: q_copy_a
    read: '1'
    to_state: q_goto_b_end
    write: 'Y'
    move: R
  
  - from_state: q_copy_a
    read: 'Y'
    to_state: q_copy_a
    write: 'Y'
    move: R
  
  # No más 1s en 'a' → restaurar y hacer shift
  - from_state: q_copy_a
    read: '#'
    to_state: q_restore_a
    write: '#'
    move: L
  
  # Ir al final de 'b'
  - from_state: q_goto_b_end
    read: '1'
    to_state: q_goto_b_end
    write: '1'
    move: R
  
  - from_state: q_goto_b_end
    read: '#'
    to_state: q_goto_b_end
    write: '#'
    move: R
  
  - from_state: q_goto_b_end
    read: 'Y'
    to_state: q_goto_b_end
    write: 'Y'
    move: R
  
  # Pegar 1 al final
  - from_state: q_goto_b_end
    read: '_'
    to_state: q_back_to_a
    write: '1'
    move: L
  
  # Volver a 'a' para continuar copiando
  - from_state: q_back_to_a
    read: '1'
    to_state: q_back_to_a
    write: '1'
    move: L
  
  - from_state: q_back_to_a
    read: '#'
    to_state: q_find_mark
    write: '#'
    move: L
  
  # Buscar la Y más reciente
  - from_state: q_find_mark
    read: '1'
    to_state: q_find_mark
    write: '1'
    move: L
  
  - from_state: q_find_mark
    read: 'Y'
    to_state: q_copy_a
    write: 'Y'
    move: R
  
  # ===== RESTAURAR Y SHIFT =====
  
  # Restaurar Y→1 en 'a'
  - from_state: q_restore_a
    read: 'Y'
    to_state: q_restore_a
    write: '1'
    move: L
  
  - from_state: q_restore_a
    read: '#'
    to_state: q_shift1
    write: '#'
    move: R
  
  # Shift: a_nuevo = b_viejo, b queda con la suma
  # Borrar 'a' viejo
  - from_state: q_shift1
    read: '1'
    to_state: q_shift1
    write: '_'
    move: R
  
  - from_state: q_shift1
    read: '#'
    to_state: q_shift2
    write: '#'
    move: L
  
  # Compactar: mover # a la izquierda
  - from_state: q_shift2
    read: '_'
    to_state: q_shift2
    write: '_'
    move: L
  
  - from_state: q_shift2
    read: '#'
    to_state: q_shift3
    write: '_'
    move: R
  
  # Ir al inicio de 'b' (ahora es el nuevo 'a')
  - from_state: q_shift3
    read: '_'
    to_state: q_shift3
    write: '_'
    move: R
  
  - from_state: q_shift3
    read: '1'
    to_state: q_shift4
    write: '1'
    move: L
  
  # Escribir # antes del nuevo 'a'
  - from_state: q_shift4
    read: '_'
    to_state: q_rewind
    write: '#'
    move: L
  
  # ===== LIMPIEZA FINAL =====
  
  # Limpiar 'a' (ya no necesario)
  - from_state: q_clean1
    read: '1'
    to_state: q_clean1
    write: '_'
    move: R
  
  - from_state: q_clean1
    read: '#'
    to_state: q_clean2
    write: '_'
    move: R
  
  # 'b' es el resultado
  - from_state: q_clean2
    read: '1'
    to_state: q_accept
    write: '1'
    move: S
  
  - from_state: q_clean2
    read: '_'
    to_state: q_accept
    write: '_'
    move: S
